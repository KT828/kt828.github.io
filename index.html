<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KT828が開発しているiPhone・iPadアプリの案内ページです。">
    <title>KT828 Apps</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/site.css">
</head>
<body>
    <header class="shell topbar">
        <a class="wordmark" href="./" aria-label="KT828 Apps トップ">KT828 Apps</a>
        <nav class="topnav" aria-label="ページ内ナビゲーション">
            <a href="#apps">Apps</a>
        </nav>
    </header>

    <main class="shell">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">iPhone / iPad</p>
                <h1>KT828のアプリ</h1>
                <p class="lead">個人で開発しているアプリと、それぞれのサポート情報を掲載しています。</p>
            </div>
        </section>

        <section class="section" id="apps">
            <h2>Apps</h2>
            <div class="app-list">
                <a class="app-row" href="./kaku/">
                    <span class="app-glyph" aria-hidden="true">K</span>
                    <div>
                        <h2>KAKU</h2>
                        <p>小説を書くための執筆支援アプリ</p>
                    </div>
                    <span class="row-status">詳細を見る</span>
                </a>

                <a class="app-row" href="./fandom/">
                    <span class="app-glyph" aria-hidden="true">F</span>
                    <div>
                        <h2>Fandom Finance</h2>
                        <p>推し活のための予算・支出管理</p>
                    </div>
                    <span class="row-status">詳細を見る</span>
                </a>

                <a class="app-row" href="./yomu/">
                    <span class="app-glyph" aria-hidden="true">Y</span>
                    <div>
                        <h2>YOMU</h2>
                        <p>保存済み読書データの確認と書き出し</p>
                    </div>
                    <span class="row-status">新規配信終了</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="shell footer">
        <p>&copy; 2026 KT828</p>
        <p>iPhone / iPad apps</p>
    </footer>
</body>
</html>
